specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Bank of America
providerId: bank-of-america
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Corporate Banking
  - Finance
  - Payments
  - Treasury
  - CashPro
description: The Bank of America CashPro API is a corporate-treasury offering available only to existing
  CashPro clients. Access requires a corporate-banking relationship and contractual onboarding through
  the CashPro Developer Studio. There is no published consumer-facing pricing or self-serve plan; fees
  are part of the broader CashPro / treasury services agreement.
notes: No public API rate card. Pricing for CashPro services is bundled into the corporate banking relationship
  and disclosed under existing client agreements. Reconcile against the customer's Treasury Services agreement
  or CashPro fee schedule, which is not public.
sources:
  - https://developer.bankofamerica.com/
  - https://business.bofa.com/en-us/content/cashpro.html
plans:
  - id: bank-of-america-cashpro-client
    name: CashPro Client (Contracted)
    type: enterprise
    description: API access included as part of an executed CashPro services agreement. Account fees,
      payment-instruction fees, statement fees, and FX margins are governed by the corporate banking
      relationship — not by API usage.
    entries:
      - label: Service Agreement
        description: API access is included with an executed CashPro / Global Treasury services agreement
        name: cashpro_agreement
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://api.bankofamerica.com/cashpro/v1
        unit: 1
        price: contact relationship manager
        userMultiplied: false
      - label: Per-Transaction Fees
        description: Banking fees apply to underlying treasury transactions (wires, ACH, check, etc.)
          per the customer's published fee schedule
        name: transaction_fees
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://api.bankofamerica.com/cashpro/v1
        unit: 1
        price: see fee schedule
        userMultiplied: false
    elements:
      - name: Bank of America CashPro API
      - name: 350+ Supported Payment Types
      - name: TMS / ERP Integration
      - name: Sandbox via CashPro Developer Studio
      - name: Relationship Manager Support
maintainers:
