naftiko: 1.0.0-alpha2
info:
  label: Bank of America CashPro API — Accounts
  description: 'Bank of America CashPro API — Accounts. 2 operations. Lead operation: List Accounts. Self-contained Naftiko
    capability covering one Bank Of America business surface.'
  tags:
  - Bank Of America
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BANK_OF_AMERICA_API_KEY: BANK_OF_AMERICA_API_KEY
capability:
  consumes:
  - type: http
    namespace: cashpro-accounts
    baseUri: https://api.bankofamerica.com/cashpro/v1
    description: Bank of America CashPro API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: listaccounts
        method: GET
        description: List Accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountType
          in: query
          type: string
          description: Filter by account type (checking, savings, etc.)
        - name: currency
          in: query
          type: string
          description: Filter by currency code (ISO 4217)
    - name: accounts-accountId
      path: /accounts/{accountId}
      operations:
      - name: getaccount
        method: GET
        description: Get Account Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          description: Unique account identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.BANK_OF_AMERICA_API_KEY}}'
  exposes:
  - type: rest
    namespace: cashpro-accounts-rest
    port: 8080
    description: REST adapter for Bank of America CashPro API — Accounts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: GET
        name: listaccounts
        description: List Accounts
        call: cashpro-accounts.listaccounts
        with:
          accountType: rest.accountType
          currency: rest.currency
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts/{accountid}
      name: accounts-accountid
      description: REST surface for accounts-accountId.
      operations:
      - method: GET
        name: getaccount
        description: Get Account Details
        call: cashpro-accounts.getaccount
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cashpro-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bank of America CashPro API — Accounts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-accounts
      description: List Accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cashpro-accounts.listaccounts
      with:
        accountType: tools.accountType
        currency: tools.currency
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account-details
      description: Get Account Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cashpro-accounts.getaccount
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
