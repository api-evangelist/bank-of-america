naftiko: 1.0.0-alpha2
info:
  label: Bank of America CashPro API — Balances
  description: 'Bank of America CashPro API — Balances. 1 operations. Lead operation: Get Account Balances. Self-contained
    Naftiko capability covering one Bank Of America business surface.'
  tags:
  - Bank Of America
  - Balances
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BANK_OF_AMERICA_API_KEY: BANK_OF_AMERICA_API_KEY
capability:
  consumes:
  - type: http
    namespace: cashpro-balances
    baseUri: https://api.bankofamerica.com/cashpro/v1
    description: Bank of America CashPro API — Balances business capability. Self-contained, no shared references.
    resources:
    - name: accounts-accountId-balances
      path: /accounts/{accountId}/balances
      operations:
      - name: getaccountbalances
        method: GET
        description: Get Account Balances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          description: Unique account identifier
          required: true
        - name: asOf
          in: query
          type: string
          description: Balance as of date (ISO 8601)
    authentication:
      type: bearer
      token: '{{env.BANK_OF_AMERICA_API_KEY}}'
  exposes:
  - type: rest
    namespace: cashpro-balances-rest
    port: 8080
    description: REST adapter for Bank of America CashPro API — Balances. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/accounts/{accountid}/balances
      name: accounts-accountid-balances
      description: REST surface for accounts-accountId-balances.
      operations:
      - method: GET
        name: getaccountbalances
        description: Get Account Balances
        call: cashpro-balances.getaccountbalances
        with:
          accountId: rest.accountId
          asOf: rest.asOf
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cashpro-balances-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bank of America CashPro API — Balances. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-account-balances
      description: Get Account Balances
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cashpro-balances.getaccountbalances
      with:
        accountId: tools.accountId
        asOf: tools.asOf
      outputParameters:
      - type: object
        mapping: $.
