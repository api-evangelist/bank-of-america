}

type Transaction {
  id: ID!
  accountId: ID!
  transactionDate: Date!
  postDate: Date
  amount: Decimal!
  currency: String!
  description: String!
  type: String!
  status: TransactionStatus!
  referenceNumber: String
  checkNumber: String
  merchantName: String
  merchantCategory: String
