# ─────────────────────────────────────────────
# Root Operations
# ─────────────────────────────────────────────

type Query {
  # Account queries
  account(id: ID!): Account
  accounts(customerId: ID!, type: AccountType): [Account!]!
  checkingAccount(id: ID!): CheckingAccount
  savingsAccount(id: ID!): SavingsAccount
  moneyMarket(id: ID!): MoneyMarket
  cd(id: ID!): CD
  creditCard(id: ID!): CreditCard
  mortgageAccount(id: ID!): MortgageAccount
  autoLoan(id: ID!): AutoLoan
  studentLoan(id: ID!): StudentLoan
  loc(id: ID!): LOC

  # Balance queries
  accountBalance(accountId: ID!): AccountBalance
  availableBalance(accountId: ID!): AvailableBalance
  pendingBalance(accountId: ID!): PendingBalance

  # Transaction queries
  transactionHistory(accountId: ID!, startDate: Date, endDate: Date, limit: Int, offset: Int): TransactionHistory
  transaction(id: ID!): Transaction

  # Payment queries
  payment(id: ID!): Pament
  transfer(id: ID!): Transfer
  wireTransfer(id: ID!): WireTransfer
  achPayment(id: ID!): ACHPayment
  billPayment(id: ID!): BillPayment
  zellePayment(id: ID!): Zelle

  # Card queries
  card(id: ID!): Card
  cards(accountId: ID!): [Card!]!
  cardTransactions(cardId: ID!, limit: Int, offset: Int): [CardTransaction!]!

  # Reward queries
  rewards(accountId: ID!): Reward
  offers(accountId: ID!): [Offer!]!

  # Customer queries
  customer(id: ID!): Customer
  customerProfile(customerId: ID!): CustomerProfile
  creditScore(customerId: ID!): CreditScore
  creditReport(customerId: ID!, bureau: String): CreditReport
  monthlySpending(customerId: ID!, month: String!, year: Int!): MonthlySpending
  annualSummary(customerId: ID!, year: Int!): AnnualSummary

  # Document queries
  statements(accountId: ID!): [Statement!]!
  statement(id: ID!): Statement
  taxDocuments(customerId: ID!, year: Int): [TaxDocument!]!

  # Loan queries
  loanApplication(id: ID!): LoanApplication
  loanApplications(customerId: ID!): [LoanApplication!]!
  mortgageDetail(accountId: ID!): MortgageDetail

  # Location queries
  branch(id: ID!): Branch
  branches(latitude: Decimal!, longitude: Decimal!, radiusMiles: Int): [Branch!]!
  atm(id: ID!): ATM
  atms(latitude: Decimal!, longitude: Decimal!, radiusMiles: Int): [ATM!]!
  financialCenter(id: ID!): FinancialCenter
  financialCenters(latitude: Decimal!, longitude: Decimal!, radiusMiles: Int): [FinancialCenter!]!
  appointments(customerId: ID!): [Appointment!]!

  # Auth queries
  apiKey(id: ID!): APIKey
  apiKeys: [APIKey!]!
  token(tokenId: ID!): Token
  webhooks(customerId: ID!): [Webhook!]!

  # Open banking
  openBankingConsents(customerId: ID!): [OpenBanking!]!
  trueLayerConnection(connectionId: ID!): TrueLayer
}

type Mutation {
  # Payment mutations
  initiateTransfer(input: TransferInput!): Transfer!
  initiateWireTransfer(input: WireTransferInput!): WireTransfer!
  initiateACHPayment(input: ACHPaymentInput!): ACHPayment!
  initiateZellePayment(input: ZelleInput!): Zelle!
  scheduleBillPayment(input: BillPaymentInput!): BillPayment!
  cancelPayment(id: ID!): Pament!
  depositCheck(input: CheckDepositInput!): CheckDeposit!

  # Card mutations
  activateCard(cardId: ID!): Card!
  lockCard(cardId: ID!): Card!
  unlockCard(cardId: ID!): Card!
  reportCardLost(cardId: ID!): Card!
  addAuthorizedUser(input: AuthorizedUserInput!): Authorized!

  # Loan mutations
  submitLoanApplication(input: LoanApplicationInput!): LoanApplication!
  withdrawLoanApplication(id: ID!): LoanApplication!

  # Appointment mutations
  scheduleAppointment(input: AppointmentInput!): Appointment!
  cancelAppointment(id: ID!): Appointment!

  # Reward mutations
  activateOffer(offerId: ID!): Offer!
  redeemPoints(accountId: ID!, points: Int!): RewardPoint!

  # Webhook mutations
  createWebhook(input: WebhookInput!): Webhook!
  updateWebhook(id: ID!, input: WebhookInput!): Webhook!
  deleteWebhook(id: ID!): Boolean!

  # Auth mutations
  createAPIKey(input: APIKeyInput!): APIKey!
  revokeAPIKey(id: ID!): Boolean!
  generateAccessToken(clientId: String!, clientSecret: String!, scope: String!): AccessToken!
}

# ─────────────────────────────────────────────
# Input Types
# ─────────────────────────────────────────────

input TransferInput {
  fromAccountId: ID!
  toAccountId: ID!
  amount: Decimal!
  scheduledDate: Date!
  memo: String
  isRecurring: Boolean
  recurrencePattern: String
}

input WireTransferInput {
  fromAccountId: ID!
  amount: Decimal!
  currency: String!
  valueDate: Date!
  beneficiaryName: String!
  beneficiaryAccountNumber: String!
  beneficiaryBankSwift: String
  beneficiaryBankABA: String
  purposeOfPayment: String
}

input ACHPaymentInput {
  fromAccountId: ID!
  amount: Decimal!
  effectiveDate: Date!
  secCode: String!
  companyName: String!
  companyEntryDescription: String!
  individualName: String
  receiverRoutingNumber: String!
  receiverAccountNumber: String!
}

input ZelleInput {
  fromAccountId: ID!
  recipientEmail: String
  recipientPhone: String
  amount: Decimal!
  memo: String
}

input BillPaymentInput {
  accountId: ID!
  payee: String!
  payeeAccountNumber: String
  amount: Decimal!
  scheduledDate: Date!
  memo: String
}

input CheckDepositInput {
  accountId: ID!
  amount: Decimal!
  checkNumber: String!
  routingNumber: String!
  checkAccountNumber: String!
  frontImageBase64: String!
  backImageBase64: String!
}

input AuthorizedUserInput {
  accountId: ID!
  cardId: ID
  firstName: String!
  lastName: String!
  dateOfBirth: Date!
  relationship: String!
  permissions: [String!]!
}

input LoanApplicationInput {
  customerId: ID!
  applicationType: String!
  requestedAmount: Decimal!
  termMonths: Int
  purposeOfLoan: String
  annualIncome: Decimal!
  employmentStatus: String!
}

input AppointmentInput {
  branchId: ID
  customerId: ID!
  appointmentType: AppointmentType!
  topic: String!
  scheduledDateTime: DateTime!
  durationMinutes: Int!
  notes: String
}

input WebhookInput {
  url: String!
  events: [WebhookEvent!]!
  secret: String!
  headers: JSON
}

input APIKeyInput {
  name: String!
  scopes: [String!]!
  expiresAt: DateTime
  environment: String!
}
