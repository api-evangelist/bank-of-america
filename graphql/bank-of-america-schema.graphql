"""
Bank of America CashPro GraphQL Schema
Conceptual schema covering accounts, transactions, payments, customers,
branches, credit, and authentication domains for the CashPro API platform.
"""

# ─────────────────────────────────────────────
# Scalars
# ─────────────────────────────────────────────

scalar Date
scalar DateTime
scalar Decimal
scalar JSON

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum AccountType {
  CHECKING
  SAVINGS
  MONEY_MARKET
  CD
  CREDIT_CARD
  MORTGAGE
  AUTO_LOAN
  STUDENT_LOAN
  LINE_OF_CREDIT
}

enum AccountStatus {
  ACTIVE
  INACTIVE
  FROZEN
  CLOSED
}

enum TransactionStatus {
  PENDING
  POSTED
  CANCELLED
  RETURNED
}

enum PaymentStatus {
  INITIATED
  PROCESSING
  COMPLETED
  FAILED
  CANCELLED
  RETURNED
}

enum PaymentType {
  ACH
  WIRE
  SWIFT
  RTP
  BOOK
  CHECK
  ZELLE
  BILL_PAY
}

enum CardStatus {
  ACTIVE
  INACTIVE
  LOST
  STOLEN
  EXPIRED
  BLOCKED
}

enum LoanApplicationStatus {
  SUBMITTED
  UNDER_REVIEW
  CONDITIONALLY_APPROVED
  APPROVED
  DENIED
  WITHDRAWN
}

enum AppointmentType {
  IN_BRANCH
  PHONE
  VIDEO
}

enum AppointmentStatus {
  SCHEDULED
  CONFIRMED
  COMPLETED
  CANCELLED
  NO_SHOW
}

enum WebhookEvent {
  TRANSACTION_POSTED
  PAYMENT_STATUS_CHANGED
  BALANCE_THRESHOLD_REACHED
  STATEMENT_AVAILABLE
  CARD_TRANSACTION
}

# ─────────────────────────────────────────────
# Account Types
# ─────────────────────────────────────────────

interface Account {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  accountType: AccountType!
  status: AccountStatus!
  nickname: String
  openedDate: Date!
  balance: AccountBalance!
  customer: Customer!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
}

type CheckingAccount implements Account {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  accountType: AccountType!
  status: AccountStatus!
  nickname: String
  openedDate: Date!
  balance: AccountBalance!
  customer: Customer!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
  overdraftProtection: Boolean!
  linkedSavingsAccountId: ID
  monthlyFee: Decimal
  atmCard: Card
}

type SavingsAccount implements Account {
  id: ID!
  accountNumber: String!
  routingNumber: String!
  accountType: AccountType!
  status: AccountStatus!
  nickname: String
  openedDate: Date!
  balance: AccountBalance!
  customer: Customer!
  transactions(limit: Int, offset: Int, startDate: Date, endDate: Date): TransactionHistory!
  statements: [Statement!]!
  interestRate: Decimal!
  interestEarnedYTD: Decimal!
