specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Bank of America
providerId: bank-of-america
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Corporate Banking
  - CashPro
  - Rate Limiting
description: Bank of America's CashPro API rate limits are not publicly documented. Limits and capacity
  guarantees are scoped per CashPro client and disclosed during onboarding through the CashPro Developer
  Studio. No numeric per-second or per-minute values are asserted here.
notes: Reconcile with onboarding documentation issued by Bank of America's CashPro Developer Studio.
  Do not infer numbers from third-party banking-API patterns.
sources:
  - https://developer.bankofamerica.com/
responseCodes:
  throttled: 429
limits:
  - name: Per-client throttle
    scope: client
    metric: varies
    limit: 'see CashPro Developer Studio onboarding documentation'
    notes: Limits are scoped to the client/application registered through CashPro Developer Studio.
policies:
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on 429 responses; honor Retry-After if returned.
  - name: Idempotency
    description: Payment-initiation endpoints commonly require idempotency keys; retries without an idempotency
      key risk duplicate transactions.
  - name: Banking-Hours Capacity
    description: Some payment rails (wires, same-day ACH) have cutoff times that effectively constrain
      throughput regardless of API rate limits.
  - name: Onboarding-Defined Capacity
    description: Application-level capacity is set during CashPro onboarding; raise via your relationship
      manager.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
