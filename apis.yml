description: Bank of America is a multinational investment bank and financial services
  holding company providing consumer banking, wealth management, corporate banking,
  and investment banking services worldwide. The CashPro Developer Studio provides
  REST APIs for corporate treasury clients to automate account management, payments,
  balance reporting, and statement access, supporting over 350 payment types and integration
  with TMS and ERP platforms.
