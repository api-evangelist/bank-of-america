specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Bank of America
providerId: bank-of-america
publisherName: Bank of America Corporation
serviceCategory: Corporate Banking / Treasury Services
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Corporate Banking
  - Treasury
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps shape for Bank of America CashPro: API access is bundled into a corporate
  banking / treasury services agreement, so FinOps focuses on per-transaction banking fees (wire, ACH,
  FX margin) rather than per-API-call charges. Public meter values are not available.'
notes: No public rate card. Replace meter prices with the customer's negotiated CashPro fee schedule
  once available.
sources:
  - https://developer.bankofamerica.com/
  - https://business.bofa.com/en-us/content/cashpro.html
principles:
  - name: Visibility
    description: Pull statements and transaction details via the CashPro APIs to attribute banking fees
      back to the originating business unit.
  - name: Allocation
    description: Allocate wire, ACH, lockbox, and FX fees by originating account, business unit, and payment
      type using the structured payment metadata returned by the API.
  - name: Optimization
    description: Optimize payment-rail mix (ACH vs wire vs same-day ACH vs RTP) based on cost vs settlement-time
      requirements; consolidate FX across business units to negotiate tighter spreads.
  - name: Accountability
    description: Assign a corporate treasury owner who reviews monthly account-analysis statements and
      reconciles fee categories to internal cost centers.
billingModel:
  pricingCategory: Bundled Banking Fees
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Tax
    - Adjustment
    - Refund
    - Credit
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Bank of America CashPro
  ServiceCategory: Corporate Banking / Treasury Services
  ProviderName: Bank of America
  PublisherName: Bank of America Corporation
  InvoiceIssuerName: Bank of America, N.A.
  PricingCategory: Bundled Banking Fees
  PricingUnit: transaction
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: payment_transactions
    description: Count of payment instructions submitted (wires, ACH, check, RTP, etc.)
    unit: transaction
    aggregation: sum
    dimensions:
      - payment_type
      - originating_account
      - business_unit
  - name: payment_volume
    description: Settled payment value (separate from per-transaction fees)
    unit: USD
    aggregation: sum
    dimensions:
      - payment_type
      - currency
      - originating_account
  - name: fx_volume
    description: FX-converted volume; pricing is via spread/margin, not per-API-call fee
    unit: USD
    aggregation: sum
    dimensions:
      - currency_pair
      - originating_account
  - name: balance_inquiries
    description: Balance and statement API calls; included with the CashPro relationship
    unit: request
    aggregation: sum
    dimensions:
      - account
      - api
apis:
  - name: Bank of America CashPro API
    baseURL: https://api.bankofamerica.com/cashpro/v1
    tags:
      - Accounts
      - Balances
      - Banking
      - Corporate Banking
      - Payments
      - Statements
      - Treasury
    serviceName: Bank of America CashPro API
    serviceCategory: API
unitEconomics:
  - name: Cost per Payment Transaction
    metric: total_payment_fees / payment_transactions
    target: minimize via rail-mix optimization
  - name: FX Margin Rate
    metric: fx_margin_revenue / fx_volume
    target: negotiate downward at relationship review
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
